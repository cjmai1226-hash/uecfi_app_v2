name: uecfi_app_v2
description: "A new Flutter project for UECFI."
publish_to: 'none'
version: 2.1.5+46

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.1
  sqflite_common_ffi: ^2.3.3
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  google_mobile_ads: ^9.1.0
  in_app_review: ^2.0.12
  firebase_storage: ^13.5.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/db/uecfi.db
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Graphik
      fonts:
        - asset: assets/fonts/Graphik-Light-Trial.otf
          weight: 300
        - asset: assets/fonts/Graphik-Regular-Trial.otf
          weight: 400
        - asset: assets/fonts/Graphik-RegularItalic-Trial.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Graphik-Medium-Trial.otf
          weight: 500
        - asset: assets/fonts/Graphik-MediumItalic-Trial.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Graphik-Semibold-Trial.otf
          weight: 600
        - asset: assets/fonts/Graphik-SemiboldItalic-Trial.otf
          weight: 600
          style: italic
        - asset: assets/fonts/Graphik-Bold-Trial.otf
          weight: 700
        - asset: assets/fonts/Graphik-BoldItalic-Trial.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Graphik-Black-Trial.otf
          weight: 900

flutter_launcher_icons:
  android: true
  image_path: "assets/images/image.png"

